<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Peta RDTR - Integrated</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .logo-big {
            position: absolute; top: 20px; left: 20px; width: 80px;
            z-index: 1000; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            pointer-events: none;
        }

        .sticky-sidebar {
            position: absolute; top: 20px; right: 20px; width: 320px;
            z-index: 1000; background: rgba(30, 34, 38, 0.95); color: white;
            border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-height: 90vh; display: flex; flex-direction: column;
        }
        
        .sidebar-header { 
            padding: 15px; background: #111; font-weight: bold; text-align: center; 
            border-radius: 10px 10px 0 0; border-bottom: 1px solid #333; 
        }

        .menu-item { border-bottom: 1px solid #333; }
        .menu-btn { 
            width: 100%; padding: 15px; background: none; border: none; color: white;
            text-align: left; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px;
        }
        .menu-btn:hover { background: #2c3136; }
        
        .menu-content { display: none; background: #252a2e; padding: 12px; max-height: 450px; overflow-y: auto; }

        #capaianMenu { overflow: visible !important; }
        #capaianMenu .filter-box { position: relative; }

        .filter-box select, .filter-box input { 
            width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; 
            background: #1a1d20; color: white; margin-bottom: 8px; font-size: 12px; outline: none;
            box-sizing: border-box;
        }
        
        #suggestionList {
          
            background: #1a1d20;
            border-radius: 5px;
            max-height: 250px;
            overflow-y: auto;
            position: absolute; /* Melayang di atas elemen lain */
            width: 90%;          /* Sesuaikan lebar dengan box */
            z-index: 9999 !important; /* Supaya di paling depan */
            display: none; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 1px solid #e63946; /* Warna merah agar senada */
            margin-top: 5px;
        }
        

        .wp-card { padding: 12px; border-bottom: 1px solid #3e444a; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .wp-card:hover { background: #3e444a; border-left: 4px solid #e63946; }

        .kab-label { font-size: 10px; color: #e63946; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .status-badge { background: #a47128; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .info-empty { text-align: center; font-size: 11px; color: #888; padding: 15px; }

        .legend { padding: 10px; background: rgba(30, 34, 38, 0.9); color: white; line-height: 18px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.5); font-size: 12px; }
        .legend i { width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 2px; }

        .menu-content::-webkit-scrollbar { width: 5px; }
        .menu-content::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
    
        .wp-card {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wp-card i {
            opacity: 0.9;
        }

        /* Tambahkan transisi agar saat hover lebih halus */
        .wp-card:hover {
            background: #2c3136;
            transform: translateX(5px);
        }
    
    
    </style>
</head>
<body>

    <img src="Logo-BIG.png" class="logo-big" alt="Logo BIG">

    <div class="sticky-sidebar">
        <div class="sidebar-header">
            DASHBOARD PETA TERVERIFIKASI
            <!-- Baris Skala Baru -->
            <div style="font-size: 13px; color: #ececec; font-weight: bold; margin-top: 5px; letter-spacing: 1px;">
                Skala 1 : 5.000
            </div>
            
            <div style="font-size: 11px; font-weight: normal; color: #888; margin-top: 4px;">
                (Tahun 2023 - 2025)
            </div>
        </div>
        
        <div class="menu-item">
            <button class="menu-btn" onclick="toggleMenu('capaianMenu')">
                <span><i class="fas fa-layer-group"></i> Capaian Peta Terverifikasi</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div id="capaianMenu" class="menu-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                    <label style="cursor: pointer; font-size: 13px; display: flex; align-items: center;">
                        <input type="checkbox" onchange="toggleCapaianLayer(this, '2023')" style="margin-right: 8px;"> Capaian Tahun 2023
                    </label>
                    <span style="font-size: 11px; color: #aaa; font-weight: bold; background: #1a1d20; padding: 2px 6px; border-radius: 4px;">6.653 km²</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                    <label style="cursor: pointer; font-size: 13px; display: flex; align-items: center;">
                        <input type="checkbox" onchange="toggleCapaianLayer(this, '2024')" style="margin-right: 8px;"> Capaian Tahun 2024
                    </label>
                    <span style="font-size: 11px; color: #aaa; font-weight: bold; background: #1a1d20; padding: 2px 6px; border-radius: 4px;">8.968 km²</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                    <label style="cursor: pointer; font-size: 13px; display: flex; align-items: center;">
                        <input type="checkbox" onchange="toggleCapaianLayer(this, '2025')" style="margin-right: 8px;"> Capaian Tahun 2025
                    </label>
                    <span style="font-size: 11px; color: #aaa; font-weight: bold; background: #1a1d20; padding: 2px 6px; border-radius: 4px;">9.925 km²</span>
                </div>
                <hr style="border: 0.5px solid #444; margin: 15px 0;">
                <div class="filter-box">
                    <input type="text" id="searchCapaian" oninput="suggestCapaian()" placeholder="Cari Nama WP Capaian..." autocomplete="off">
                    <div id="suggestionList"></div>
                </div>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="toggleMenu('pantauanMenu')">
                <span><i class="fas fa-chart-line"></i> Pantauan Penyusunan</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div id="pantauanMenu" class="menu-content">
                <div class="filter-box">
                    <select id="selectProv" onchange="renderList()">
                        <option value="">-- Pilih Provinsi --</option>
                    </select>
                    <input type="text" id="searchWP" oninput="renderList()" placeholder="Cari WP atau Klik di Peta...">
                </div>
                <div id="listPenyusunan">
                    <div class="info-empty">Klik wilayah pada peta atau gunakan kolom pencarian untuk melihat data.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // RUMUS KUNCI ZOOM & WILAYAH INDONESIA
        const southWest = L.latLng(-15.0, 88.0);
        const northEast = L.latLng(10.0, 150.0);
        const bounds = L.latLngBounds(southWest, northEast);

        const map = L.map('map', { 
            zoomControl: false,
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            minZoom: 5 
        }).setView([-2.5, 118.0], 5);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'BIG'
        }).addTo(map);

        let allDataWP = [];
        let geojsonLayer;
        let layersCapaian = {
            '2023': { url: 'RDTR_2023.geojson', layer: null, color: '#FFFF00' },
            '2024': { url: 'RDTR_2024.geojson', layer: null, color: '#FF00FF' },
            '2025': { url: 'RDTR_2025.geojson', layer: null, color: '#00FFFF' }
        };

        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDShzrseHm6SB62TooPovnM0oWkY7-iR67mDcsu8GKhfIaMBdkADf05HBSAt7DDHU7zSXRsMKfKk9e/pub?gid=155811995&single=true&output=csv";
        const geojsonPath = "Kab_Kota.geojson"; 

        // Layer Provinsi (Hanya Garis Batas)
            fetch("Provinsi.geojson") // Pastikan Anda punya file ini
                .then(res => res.json())
                .then(data => {
                L.geoJSON(data, {
                    interactive: false, // PENTING: Klik akan tembus ke layer di bawahnya
                    style: {
                    color: "#000000", // Warna garis putih agar kontras dengan satelit
                    weight: 2.0,        // Garis lebih tebal dari kabupaten
                    fillOpacity: 0,   // Transparan tengahnya
                    pane: 'overlayPane'
                    }
             }).addTo(map);
                });


        // LEGENDA OTOMATIS SINKRON WARNA
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = '<strong style="display:block; margin-bottom:5px;">Legenda Capaian</strong>';
            Object.keys(layersCapaian).forEach(tahun => {
                const config = layersCapaian[tahun];
                div.innerHTML += `<div style="display: flex; align-items: center; margin-bottom: 3px;"><i style="background: ${config.color}"></i> Capaian ${tahun}</div>`;
            });
            return div;
        };
        legend.addTo(map);

        fetch(geojsonPath)
            .then(res => res.json())
            .then(data => {
                geojsonLayer = L.geoJSON(data, {
                    style: { color: '#FFFACD', weight: 0.2, fillOpacity: 0.1 },
                    onEachFeature: (feature, layer) => {
                        const namaKab = feature.properties.Kab_Kota || "Kabupaten Tidak Diketahui";
                        const namaProv = feature.properties.Provinsi || "Provinsi Tidak Diketahui";
                        layer.bindPopup(`<div style="font-family: 'Segoe UI', sans-serif;"><strong style="color: #e63946;">${namaKab}</strong><br><span style="color: #555; font-size: 11px;">Provinsi ${namaProv}</span></div>`);
                        layer.on('click', function (e) {
                            L.DomEvent.stopPropagation(e);
                            updateSidebarByKab(namaKab);
                            layer.setStyle({ fillOpacity: 0.4, color: '#e63946' });
                            setTimeout(() => geojsonLayer.resetStyle(layer), 1000);
                        });
                    }
                }).addTo(map);
            });

        fetch(sheetUrl)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                allDataWP = lines.slice(1).map(line => {
                    const columns = line.split(",");
                    return {
                        provinsi: columns[0]?.trim().toUpperCase() || "",
                        kab_kota: columns[1]?.trim().toUpperCase() || "",
                        nama_wp: columns[2]?.trim() || "",
                        status: columns[4]?.trim() || "Status Tidak Tersedia"
                    };
                }).filter(item => item.nama_wp !== "");
                const select = document.getElementById('selectProv');
                const provs = [...new Set(allDataWP.map(d => d.provinsi))].sort();
                provs.forEach(p => { if(p) { let opt = document.createElement('option'); opt.value = p; opt.innerText = p; select.appendChild(opt); } });
            });

        function toggleMenu(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function toggleCapaianLayer(checkbox, tahun) {
    const config = layersCapaian[tahun];
    const searchInput = document.getElementById('searchCapaian');

    if (checkbox.checked) {
        if (!config.layer) {
            fetch(config.url).then(res => res.json()).then(data => {
                config.layer = L.geoJSON(data, {
                    style: { color: config.color, weight: 2, fillOpacity: 0.6 },
                    onEachFeature: (feature, layer) => {
                        // --- KEMBALIKAN BAGIAN LENGKAP INI ---
                        const namaWP = feature.properties.Nama_WP || "Tidak Ada Nama";
                        const kab = feature.properties.Kab_Kota || "-";
                        const luas = feature.properties.Luas_Area || "0";
                        const nomorSPP = feature.properties.Nomor_SPP || "Belum Tersedia";
                        const link = feature.properties.Link || "#";

                        layer.bindPopup(`
                            <div style="font-family: 'Segoe UI', sans-serif; min-width: 200px;">
                                <strong style="color: #333; font-size: 14px;">RDTR Capaian ${tahun}</strong><br>
                                <span style="font-size: 13px; color: #e63946; font-weight: bold;">${namaWP}</span>
                                <hr style="margin: 8px 0; border: 0.5px solid #eee;">
                                
                                <table style="width: 100%; font-size: 11px; color: #666; margin-bottom: 10px;">
                                    <tr><td><strong>Kab/Kota</strong></td><td>: ${kab}</td></tr>
                                    <tr><td><strong>Luas</strong></td><td>: ${luas} km²</td></tr>
                                    <tr><td><strong>Nomor SPP</strong></td><td>: ${nomorSPP}</td></tr>
                                </table>

                                <a href="${link}" target="_blank" style="
                                    display: block; 
                                    text-align: center; 
                                    background: #e63946; 
                                    color: white; 
                                    padding: 6px; 
                                    border-radius: 4px; 
                                    text-decoration: none; 
                                    font-size: 11px; 
                                    font-weight: bold;">
                                    <i class="fas fa-file-pdf"></i> Lihat Dokumen Verifikasi
                                </a>
                            </div>
                        `);
                    }
                }).addTo(map);
            });
        } else { 
            // Kalau sudah ada di memori, panggil lagi
            if (!map.hasLayer(config.layer)) {
                config.layer.addTo(map);
            }
        }
    } else { 
        if (config.layer && map.hasLayer(config.layer)) {
            map.removeLayer(config.layer); 
        }
    }
    
    
    // --- Logika Placeholder Search ---
    const anyLayerActive = Object.values(layersCapaian).some(c => c.layer !== null && map.hasLayer(c.layer));
    if (anyLayerActive) {
        searchInput.placeholder = "Cari Nama WP atau Kabupaten...";
        searchInput.style.borderColor = "#444";
    } else {
        searchInput.placeholder = "Aktifkan layer capaian dahulu...";
        searchInput.style.borderColor = "#e63946";
    }
}

        
        function suggestCapaian() {
            const input = document.getElementById('searchCapaian').value.toLowerCase();
            const suggestBox = document.getElementById('suggestionList');
    
                if (input.length < 3) { 
                    suggestBox.style.display = 'none'; 
                return; 
                }

            let matches = [];
                suggestBox.innerHTML = ''; 

                // 1. CARI DI DATA CAPAIAN (WP RDTR)
                Object.keys(layersCapaian).forEach(tahun => {
                    const config = layersCapaian[tahun];
                    if (config.layer && map.hasLayer(config.layer)) { 
                    config.layer.eachLayer(layer => {
                    const namaWP = layer.feature.properties.Nama_WP || "";
                    if (namaWP.toLowerCase().includes(input)) {
                        matches.push({ 
                        nama: namaWP, 
                        tahun: tahun, 
                        layer: layer,
                        type: 'WP',
                        kab: layer.feature.properties.Kab_Kota || "-" 
                        });
                    }
                    });
                    }
                });

                // 2. CARI DI DATA ADMINISTRASI (KABUPATEN/KOTA)
                // Pastikan geojsonLayer (batas admin) sudah ter-load
                    if (geojsonLayer) {
                        geojsonLayer.eachLayer(layer => {
                        const namaKab = layer.feature.properties.Kab_Kota || "";
                        const namaProv = layer.feature.properties.Provinsi || "";
            
                    if (namaKab.toLowerCase().includes(input) || namaProv.toLowerCase().includes(input)) {
                    matches.push({
                    nama: namaKab,
                    layer: layer,
                    type: 'Admin',
                    kab: namaProv // Untuk admin, kita tampilkan provinsinya
                    });
                    }
                    });
                    }

                // 3. RENDER HASIL
                    if (matches.length > 0) {
                        suggestBox.style.display = 'block';
                // Ambil 10 hasil teratas agar tidak kepanjangan
                        matches.slice(0, 10).forEach(match => {
                            const item = document.createElement('div');
                            item.className = 'wp-card';
            
                // Diferensiasi Icon & Label
                    const isWP = match.type === 'WP';
                    const icon = isWP ? 'fa-map-marked-alt' : 'fa-city';
                    const label = isWP ? `Capaian ${match.tahun}` : 'Batas Administrasi';
                    const color = isWP ? '#e63946' : '#3498db';

                item.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="color: ${color}; font-size: 1.1rem; width: 20px; text-align: center;">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div>
                        <div style="font-weight:bold; font-size: 13px;">${match.nama}</div>
                        <div style="font-size:10px; color:#aaa;">${match.kab} - ${label}</div>
                    </div>
                </div>
            `;

            item.onclick = () => {
                // Navigasi Peta
                if (isWP) {
                    map.fitBounds(match.layer.getBounds(), { padding: [50, 50] });
                    match.layer.openPopup();
                } else {
                    // FlyTo untuk Kabupaten agar lebih halus
                    map.flyToBounds(match.layer.getBounds(), { padding: [30, 30], duration: 1.5 });
                    match.layer.openPopup();
                }
                
                // Efek Kedip Highlight
                match.layer.setStyle({ color: '#ff0000', weight: 5, fillOpacity: 0.5 });
                setTimeout(() => {
                    // Kembalikan ke style asli
                    if (isWP) {
                        match.layer.setStyle({ color: layersCapaian[match.tahun].color, weight: 2, fillOpacity: 0.6 });
                    } else {
                        match.layer.setStyle({ color: '#a0a0a0', weight: 0.25, fillOpacity: 0.1 });
                    }
                }, 2000);

                suggestBox.style.display = 'none';
                document.getElementById('searchCapaian').value = match.nama;
            };
            suggestBox.appendChild(item);
            });
            } else {
                suggestBox.innerHTML = '<div class="info-empty">Data tidak ditemukan</div>';
                suggestBox.style.display = 'block';
            }
        }


        function resetAllStyles() { Object.keys(layersCapaian).forEach(tahun => { if (layersCapaian[tahun].layer) layersCapaian[tahun].layer.resetStyle(); }); }
        document.addEventListener('click', (e) => { if (!document.getElementById('capaianMenu').contains(e.target)) { document.getElementById('suggestionList').style.display = 'none'; } });
        map.on('click', () => resetAllStyles());

        function updateSidebarByKab(namaKab) {
            const container = document.getElementById('listPenyusunan');
            document.getElementById('searchWP').value = ""; 
            const filtered = allDataWP.filter(d => namaKab.toUpperCase().includes(d.kab_kota.toUpperCase()) || d.kab_kota.toUpperCase().includes(namaKab.toUpperCase()));
            if (filtered.length === 0) { container.innerHTML = `<div class="info-empty">Tidak ada data penyusunan di <strong>${namaKab}</strong>.</div>`; return; }
            container.innerHTML = `<div style="padding:10px 0; border-bottom:1px solid #444; margin-bottom:10px;"><span class="kab-label">Wilayah Terpilih:</span><span style="font-weight:bold;">${namaKab}</span></div>`;
            filtered.forEach(item => { const card = document.createElement('div'); card.className = 'wp-card'; card.innerHTML = `<div style="font-weight:bold;">${item.nama_wp}</div><div class="status-badge">${item.status}</div>`; container.appendChild(card); });
        }

        function renderList() {
            const container = document.getElementById('listPenyusunan');
            const search = document.getElementById('searchWP').value.toLowerCase();
            const filterProv = document.getElementById('selectProv').value;
            if (search.length < 3) { container.innerHTML = `<div class="info-empty">Silakan ketik minimal 3 karakter untuk mencari data di ${filterProv || 'wilayah ini'}.</div>`; return; }
            container.innerHTML = '';
            const filtered = allDataWP.filter(d => {
                const matchSearch = d.nama_wp.toLowerCase().includes(search) || d.kab_kota.toLowerCase().includes(search);
                const matchProv = (filterProv === '' || d.provinsi === filterProv);
                return matchProv && matchSearch;
            });
            if (filtered.length === 0) { container.innerHTML = `<div class="info-empty">Data tidak ditemukan.</div>`; return; }
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wp-card';
                card.innerHTML = `<span class="kab-label">${item.kab_kota}</span><div style="font-weight:bold;">${item.nama_wp}</div><div class="status-badge">${item.status}</div>`;
                container.appendChild(card);
            });
        }

        // Fungsi untuk menyalakan semua layer secara otomatis saat load
        window.onload = function() {
        // Daftar tahun yang ingin diaktifkan otomatis
            const daftarTahun = ['2023', '2024', '2025'];
    
            // Cari semua checkbox capaian (kita asumsikan urutannya sama)
            const checkboxes = document.querySelectorAll('input[onchange*="toggleCapaianLayer"]');
    
                daftarTahun.forEach((tahun, index) => {
                    if (checkboxes[index]) {
                // 1. Centang checkbox secara visual
                    checkboxes[index].checked = true;
            
                // 2. Jalankan fungsi untuk memuat data ke peta
                    toggleCapaianLayer(checkboxes[index], tahun);
                    }
                });

            // Opsional: Buka menu sidebar secara otomatis agar user tahu ada fitur search
                document.getElementById('capaianMenu').style.display = 'block';
        };

    </script>
</body>
</html>
